<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <title>Create Account - HalluCheck</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>


<body>


<div class="auth-wrap">

    <div class="sheet auth-card">


        <h1>Create your account</h1>


        <p class="sub">
            Free to start. No card required.
        </p>



        <form method="POST" action="/register">


            <div class="field">

                <label>
                    Full name
                </label>

                <input 
                    type="text"
                    name="name"
                    required>

            </div>



            <div class="field">

                <label>
                    Email
                </label>

                <input 
                    type="email"
                    name="email"
                    required>

            </div>



            <div class="field">

                <label>
                    Password
                </label>

                <input 
                    type="password"
                    name="password"
                    required>

                <span class="hint">
                    At least 8 characters.
                </span>

            </div>



            <div class="field">

                <label>
                    Confirm Password
                </label>

                <input 
                    type="password"
                    name="confirm_password"
                    required>

            </div>



            <button type="submit" class="btn btn-primary btn-block">

                Create account

            </button>


        </form>



        <div class="form-flip">

            Already have an account?

            <a href="/login">
                Log in
            </a>

        </div>


    </div>

</div>



</body>

</html>
